services:
  api:
    build: .
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-mock}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-static}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_SEARCH_TOOL: ${MCP_SEARCH_TOOL:-web_search}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-35}
      CHECKPOINT_DB: /app/data/checkpoints.db
      APP_DB: /app/data/app.db
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-job_agent_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-job-agent}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
